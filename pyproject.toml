[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecview"
version = "1.0.0"
description = "Linked 3D, Hi-C and path views of ecDNA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas>=2.1", "plotly>=5"]
authors = [{name = "Biswanath Chowdhury"}]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/Biswanath2410/ecview"

[project.optional-dependencies]
hic = ["hic-straw"]
cool = ["cooler"]
bigwig = ["pyBigWig"]
cadet = ["matplotlib"]
test = ["pytest"]

[project.scripts]
ecview = "ecview.main:main"

[tool.setuptools]
packages = ["ecview"]

[tool.setuptools.package-data]
ecview = ["template.html"]
