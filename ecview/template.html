<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{PLOTLY}}
<style>
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: #222; background: #fff; }
  #top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid #ddd; }
  #top b { font-size: 15px; margin-right: 6px; }
  #top .grp { display: flex; gap: 4px; align-items: center; }
  #grid { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: max(320px, calc(100vh - 330px)) 230px;
          gap: 4px; padding: 4px; }
  #g3wrap { grid-row: 1; grid-column: 1; position: relative; min-height: 320px; }
  #zhint { position: absolute; left: 8px; bottom: 4px; color: #888; font-size: 11px; pointer-events: none; }
  #g3 { height: 100%; }
  #gm, #gr { grid-row: 1; grid-column: 2; }
  #gp { grid-row: 2; grid-column: 1 / span 2; height: 230px; }
  #gm, #gr { min-height: 320px; }
  #grid.one #g3wrap, #grid.one #gm, #grid.one #gr { grid-column: 1 / span 2; }
  #info { position: fixed; right: 12px; bottom: 12px; z-index: 20; width: min(470px, 92vw); max-height: 36vh; overflow: hidden;
          background: rgba(255,255,255,.93); border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
          padding: 8px 12px; line-height: 1.45; pointer-events: none; }  /* drags and clicks go through to the plots */
  #info:empty { display: none; }
  #info .x { float: right; cursor: pointer; color: #888; font-size: 16px; margin-left: 8px; pointer-events: auto; }
  #info table { border-collapse: collapse; margin-top: 4px; }
  #info td, #info th { padding: 1px 10px 1px 0; text-align: left; }
  #tab { padding: 4px 14px 160px; overflow-x: auto; }
  #tab:empty { display: none; }
  #tab table { border-collapse: collapse; }
  #tab td, #tab th { padding: 2px 14px 2px 0; text-align: left; border-bottom: 1px solid #eee; }
  #note { color: #666; }
  #cmp { padding: 4px 12px 6px; border-bottom: 1px solid #ddd; }
  #cmp table { border-collapse: collapse; }
  #cmp td, #cmp th { padding: 2px 14px 2px 0; text-align: left; }
  #cmp .sm { color: #666; font-size: 12px; }
  input[type=text] { padding: 3px 6px; width: 120px; }
  input[type=number] { width: 60px; }
  button, select { padding: 3px 6px; }
  .hide { display: none !important; }
  @media (max-width: 900px) {
    #grid { grid-template-columns: 1fr; grid-template-rows: 55vh 55vh auto; }
    #g3wrap { grid-row: 1; grid-column: 1; }
    #gm, #gr { grid-row: 2; grid-column: 1; }
    #gp { grid-row: 3; grid-column: 1; }
    #grid.one #g3wrap, #grid.one #gm, #grid.one #gr { grid-row: 1; grid-column: 1; }
  }
</style>
</head>
<body>
<div id="top"><b>{{TITLE}}</b>
  <span class="grp"><input type="text" id="q" placeholder="gene or bin"><button onclick="go()">find</button>
    <button onclick="clearPick()">clear</button> <button id="re3" onclick="draw3d()">reset 3D</button></span>
  <span class="grp" id="mapbox">map <select id="map" onchange="setMap(this.value)">
    <option value="gm">copies separate</option><option value="gr">genome order</option></select></span>
  <span class="grp hide" id="stbox">structure <select id="st" onchange="setStruct(this.value)"></select>
    <button onclick="$('cmp').classList.toggle('hide')">compare</button></span>
  <span class="grp" id="colbox">color <select id="col" onchange="setColor(this.value)"></select></span>
  <span class="grp" id="nearbox">within <input type="number" id="thr" value="3" min="0.5" step="0.5"> bin spacings
    <label><input type="checkbox" id="far"> only &gt; <input type="number" id="kb" value="100" min="0" step="10"> kb along</label>
    <button onclick="near()">neighbors</button> <button onclick="saveCsv()">csv</button></span>
  <span class="grp" id="arcbox">arcs</span>
  <span class="grp" id="tkbox">tracks</span>
  <span id="note"></span>
</div>
<div id="cmp" class="hide"></div>
<div id="grid"><div id="g3wrap"><div id="g3"></div><span id="zhint">drag to turn · pinch or Ctrl/⌘ + scroll to zoom</span></div><div id="gm"></div><div id="gr" class="hide"></div><div id="gp"></div></div>
<div id="tab"></div>
<div id="info"></div>
<script>
const D = {{DATA}};
const F3 = {{F3}}, FM = {{FM}}, FR = {{FR}}, FP = {{FP}};
const n = D.pos.length, $ = id => document.getElementById(id);
const g3 = $('g3'), gm = $('gm'), gr = $('gr'), gp = $('gp');
const cfg = {responsive: true, displaylogo: false, toImageButtonOptions: {format: 'svg', filename: '{{TITLE}}'}};
// plain scroll moves the page; Ctrl/Cmd + scroll zooms 3D
const cfg3 = Object.assign({}, cfg, {scrollZoom: false});
function zoom3d(e) {
  e.stopPropagation();  // before the 3D canvas sees it
  if (!(e.ctrlKey || e.metaKey) || !g3.layout) return;  // plain scroll: the page scrolls
  e.preventDefault();
  const c = g3.layout.scene.camera || {}, eye = c.eye || {x: 1.25, y: 1.25, z: 1.25};
  const k = Math.exp(Math.max(-0.5, Math.min(0.5, e.deltaY * 0.002)));
  Plotly.relayout(g3, {'scene.camera': Object.assign({}, c, {eye: {x: eye.x * k, y: eye.y * k, z: eye.z * k}})});
}
let sel = [], rows = [];

let lost = false;
function draw3d() {
  // redraw 3D, keeping camera, layers and picks
  const old = g3.data ? g3.data.map(d => d.visible) : null, cam = g3.layout ? g3.layout.scene.camera : null;
  const keep = g3.data ? g3.data.slice(-4).map(d => [d.x, d.y, d.z]) : null, L = F3.data.length;
  // copies, so F3 keeps its colors
  const data = F3.data.map((d, k) => Object.assign(structuredClone(d), old ? {visible: old[k]} : {},
    keep && k >= L - 4 ? {x: keep[k - L + 4][0], y: keep[k - L + 4][1], z: keep[k - L + 4][2]} : {}));
  const lay = Object.assign({}, F3.layout, {scene: Object.assign({}, F3.layout.scene, cam ? {camera: cam} : {})});
  const again = () => { if ($('col').value !== 'segment') setColor($('col').value); };  // keep the chosen color
  if (g3.data && !lost) return Plotly.react(g3, data, lay, cfg3).then(again);
  if (g3.data) Plotly.purge(g3);
  lost = false;
  Plotly.newPlot(g3, data, lay, cfg3).then(() => {
    again();
    const c = g3.querySelector('canvas');
    if (c) c.addEventListener('webglcontextlost', () => {
      lost = true;
      $('note').textContent = 'the 3D view stopped (browser graphics); press "reset 3D"';
    });
  });
  g3.on('plotly_click', e => {
    const cd = e.points[0].customdata;
    if (cd === undefined || cd === null) return;
    Array.isArray(cd) ? pair(cd[0], cd[1]) : pick(cd);
  });
}
const PM = FP.layout.meta;  // where tracks start, top of the y range, panel height
gp.style.height = PM.h + 'px';
function fitGrid() {  // fit the views to the window
  $('grid').style.gridTemplateRows = innerWidth > 900 ?
    `max(320px, calc(100vh - ${$('top').offsetHeight + PM.h + 20}px)) ${PM.h}px` : '';
}
fitGrid();
addEventListener('resize', fitGrid);
$('g3wrap').addEventListener('wheel', zoom3d, {passive: false, capture: true});
if (F3) draw3d(); else { $('g3wrap').classList.add('hide'); $('re3').classList.add('hide'); }
let grOn = false;  // genome-order map is drawn when first shown
if (FM) Plotly.newPlot(gm, FM.data, FM.layout, cfg);
else { gm.classList.add('hide'); $('mapbox').classList.add('hide'); }
if (!F3 || !FM) $('grid').classList.add('one');
Plotly.newPlot(gp, FP.data, FP.layout, cfg);
if (!F3) { $('nearbox').classList.add('hide'); $('colbox').classList.add('hide'); }

const shp0 = {gm: FM ? FM.layout.shapes || [] : [], gr: FR ? FR.layout.shapes || [] : [], gp: FP.layout.shapes || []};

// path panel arcs: a checkbox per layer
const AR = {};
FP.data.forEach((d, i) => { if ((d.name || '').startsWith('arc:')) (AR[d.name.slice(4)] = AR[d.name.slice(4)] || []).push(i); });
for (const k of Object.keys(AR).reverse()) $('arcbox').insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" ${FP.data[AR[k][0]].visible === false ? '' : 'checked'}
    onchange="Plotly.restyle(gp, {visible: this.checked}, [${AR[k]}])"> ${k}</label>`);
if (!Object.keys(AR).length) $('arcbox').classList.add('hide');

// path panel tracks: a checkbox each
const TK = FP.data.map((d, i) => d.meta ? i : -1).filter(i => i >= 0);
const tkY = TK.map(i => { const d = FP.data[i], y0 = PM.y0 - 0.1 - TK.indexOf(i) * 0.8 - 0.6; return d.y.map(v => v === null ? null : v - y0); });
const ann0 = (FP.layout.annotations || []).filter(a => a.name !== 'trk');
for (const i of TK) $('tkbox').insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" checked onchange="setTracks()" data-i="${i}"> ${FP.data[i].meta}</label>`);
if (!TK.length) $('tkbox').classList.add('hide');
function setTracks() {
  const on = [...$('tkbox').querySelectorAll('input')].map(b => b.checked);
  let j = 0;
  const ys = [], ann = ann0.slice(), shp = shp0.gp.filter(s => s.name !== 'trk');
  TK.forEach((i, k) => {
    const base = PM.y0 - 0.1 - j * 0.8 - 0.6;
    ys.push(tkY[k].map(v => v === null ? null : base + v));
    if (on[k]) {
      ann.push({x: -1, y: base + 0.3, text: FP.data[i].meta, showarrow: false, xanchor: 'right', font: {size: 10}});
      shp.push({type: 'line', x0: -0.5, x1: n - 0.5, y0: base, y1: base, line: {width: 0.5, color: '#bbb'}, name: 'trk'});
      j++;
    }
  });
  const extra = (gp.layout.shapes || []).slice(shp0.gp.length);
  shp0.gp = shp;
  Plotly.restyle(gp, {y: ys, visible: on}, TK);
  Plotly.relayout(gp, {annotations: ann, shapes: shp.concat(extra), 'yaxis.range': [j ? PM.y0 - 0.1 - j * 0.8 : PM.y0 + 0.1, PM.top]});
}
const L = F3 ? F3.data.length : 0, tn = L - 4, hl = L - 3, hi = L - 2, hc = L - 1;
let mapNow = 'gm', shpR = FR ? FR.layout.shapes || [] : [];

for (const k of ['segment'].concat(Object.keys(D.colors))) $('col').add(new Option(k, k));
let stNow = D.structs.length ? D.structs[0].name : null, lastShow = [[], null, []];
function setNote() {
  const s = D.structs.find(t => t.name === stNow), note = [];
  if (s && s.tot !== null) note.push(`${D.structs.length > 1 ? s.name : 'structure'} vs Hi-C: Spearman ${s.tot.toFixed(2)}`);
  else if (D.fit !== null) note.push(`structure vs Hi-C: Spearman ${D.fit.toFixed(2)}`);
  for (const k in D.rmsd) note.push(`${k}: RMSD ${D.rmsd[k].toFixed(2)} bin spacings`);
  $('note').textContent = note.join(' · ');
}
setNote();

// several structures: menu and compare table
if (D.structs.length > 1) {
  $('stbox').classList.remove('hide');
  for (const s of D.structs) $('st').add(new Option(s.name, s.name));
  let h = `<table><tr><th>structure</th><th>bins</th><th>fit to Hi-C</th><th>RMSD to ${D.structs[0].name}</th></tr>`;
  for (const s of D.structs) h += `<tr><td>${s.name}</td><td>${s.cov} of ${n}</td><td>${fmt(s.tot, 3)}</td>` +
    `<td>${s.name === D.structs[0].name ? '–' : fmt(s.rmsd, 2)}</td></tr>`;
  $('cmp').innerHTML = h + '</table><span class="sm">fit: Spearman correlation of 3D distance and contacts; ' +
    'RMSD in bin spacings after alignment (rotation, mirror, scale), over the bins both have</span>';
}
function setStruct(k) {
  const s = D.structs.find(t => t.name === k);
  stNow = k;
  $('st').value = k;
  D.xyz = s.xyz;
  D.step = s.step;
  if ('fit to Hi-C' in D.colors) D.colors['fit to Hi-C'] = s.fit;
  for (const c of Object.keys(D.colors)) if (c.startsWith('shift vs ')) delete D.colors[c];
  for (const o in D.shift[k]) D.colors['shift vs ' + o] = D.shift[k][o];
  const cur = $('col').value;
  $('col').innerHTML = '';
  for (const c of ['segment'].concat(Object.keys(D.colors))) $('col').add(new Option(c, c));
  $('col').value = [...$('col').options].some(o => o.value === cur) ? cur : 'segment';
  // redraw traces for this structure
  const ks = [], xs = [], ys = [], zs = [];
  F3.data.forEach((d, j) => {
    if (!Array.isArray(d.meta)) return;
    const c = a => d.meta.map(i => i === null ? null : D.xyz[i][a]);
    [d.x, d.y, d.z] = [c(0), c(1), c(2)];
    ks.push(j); xs.push(d.x); ys.push(d.y); zs.push(d.z);
  });
  Plotly.restyle(g3, {x: xs, y: ys, z: zs}, ks);
  show(...lastShow);
  setColor($('col').value);
  setNote();
}

function say(h) {
  // details box (bottom right); empty = hidden
  $('info').innerHTML = h ? '<span class="x" onclick="say(\'\')">×</span>' + h : '';
}

function where(i) {
  const p = D.pos[i];
  return `${D.chrom[i]}:${(p / 1e6).toFixed(3)}-${((p + D.res) / 1e6).toFixed(3)} Mb (${D.ori[i]}), seg ${D.seg[i]}`;
}
function dist3(i, j) {
  if (!D.xyz) return null;
  const a = D.xyz[i], b = D.xyz[j];
  return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
}
function pathd(i, j) {
  let d = Math.abs(i - j);
  if (!D.linear) d = Math.min(d, n - d);
  return d * D.res;
}
function val(i, j) { return FM ? Math.expm1(gm.data[0].z[i][j]) : null; }
function rval(a, b) { return FR ? Math.expm1(FR.data[0].z[a][b]) : null; }
function fmt(v, k = 2) { return v === null || v === undefined || isNaN(v) ? '–' : Number(v).toFixed(k); }
function xyzOf(l) { return {x: [l.map(i => D.xyz[i][0])], y: [l.map(i => D.xyz[i][1])], z: [l.map(i => D.xyz[i][2])]}; }
function runs(l) {
  const s = [...l].sort((a, b) => a - b), out = [];
  for (const i of s) { const r = out[out.length - 1]; if (r && i === r[1] + 1) r[1] = i; else out.push([i, i]); }
  return out;
}
function cell(x, y, c) { return {type: 'rect', x0: x - 3, x1: x + 3, y0: y - 3, y1: y + 3, line: {color: c, width: 2.5}}; }
function cross(i, m, c) {
  return [{type: 'line', x0: i, x1: i, y0: -0.5, y1: m - 0.5, line: {color: c, width: 1}},
          {type: 'line', y0: i, y1: i, x0: -0.5, x1: m - 0.5, line: {color: c, width: 1}}];
}

// pairs: list of [i, j, main?] on the path map
function show(bins, pairs, nb = []) {
  sel = bins;
  lastShow = [bins, pairs, nb];
  const cps = [...new Set(bins.flatMap(i => D.cp[i]))].filter(i => !bins.includes(i));
  if (F3) {
    const lp = pairs && pairs.length === 1 ? [pairs[0][0], pairs[0][1]] : [];
    const t = [xyzOf(nb), xyzOf(lp), xyzOf(bins), xyzOf(cps)];
    Plotly.restyle(g3, {x: t.map(a => a.x[0]), y: t.map(a => a.y[0]), z: t.map(a => a.z[0])}, [tn, hl, hi, hc]);
  }
  const ln = (x, c, d) => ({type: 'line', x0: x, x1: x, y0: 0, y1: 1, yref: 'paper', line: {color: c, width: 1.5, dash: d}});
  const band = runs(nb).map(r => ({type: 'rect', x0: r[0] - 0.5, x1: r[1] + 0.5, y0: 0, y1: 1, yref: 'paper',
                                   fillcolor: 'gold', opacity: 0.35, line: {width: 0}}));
  Plotly.relayout(gp, {shapes: shp0.gp.concat(band, bins.map(i => ln(i, 'black')), cps.map(i => ln(i, 'darkorange', 'dot')))});
  if (!FM) return;
  const s = shp0.gm.slice(), r = shp0.gr.slice();
  if (pairs && pairs.length) {
    for (const [a, b, main] of pairs) { s.push(cell(b, a, main ? 'black' : 'darkorange'), cell(a, b, main ? 'black' : 'darkorange')); }
    const p0 = pairs[0];
    r.push(cell(D.ref[p0[1]], D.ref[p0[0]], 'black'), cell(D.ref[p0[0]], D.ref[p0[1]], 'black'));
  } else {
    for (const i of bins) s.push(...cross(i, n, 'black'));
    for (const i of new Set(bins.map(i => D.ref[i]))) r.push(...cross(i, D.rk.length, 'black'));
  }
  Plotly.relayout(gm, {shapes: s});
  shpR = r;
  if (grOn) Plotly.relayout(gr, {shapes: r});
}

function pick(i) {
  i = +i;
  show([i], null);
  let h = `<b>bin ${i}</b> &nbsp; ${where(i)}`;
  if (D.cp[i].length) h += `<br>copies of this region: ${D.cp[i].map(j => `bin ${j} (seg ${D.seg[j]})`).join(', ')}`;
  const g = Object.keys(D.genes).filter(k => D.genes[k].includes(i));
  if (g.length) h += `<br>genes: ${g.join(', ')}`;
  for (const k in D.colors) if (D.colors[k][i] !== null) h += `<br>${k}: ${fmt(D.colors[k][i], 3)}`;
  say(h);
}

function copyTable(ci, cj) {
  let h = '<table><tr><th>bins</th><th>contacts</th><th>share</th><th>3D distance</th><th>called</th></tr>';
  const ps = [];
  for (const x of ci) for (const y of cj) {
    const a = Math.min(x, y), b = Math.max(x, y);
    if (!ps.some(p => p[0] === a && p[1] === b)) ps.push([a, b]);
  }
  const tot = ps.reduce((s, [a, b]) => s + (val(a, b) || 0), 0);
  for (const [a, b] of ps) {
    const v = val(a, b), c = D.con[`${a},${b}`];
    h += `<tr><td>${a} – ${b}</td><td>${fmt(v, 1)}</td><td>${tot > 0 ? fmt(100 * v / tot, 0) + '%' : '–'}</td>` +
         `<td>${fmt(dist3(a, b), 3)}</td><td>${c ? c[0] : ''}</td></tr>`;
  }
  return [h + '</table>', ps];
}

function pair(i, j) {
  i = +i; j = +j;
  if (i > j) [i, j] = [j, i];
  const ci = [i].concat(D.cp[i]), cj = [j].concat(D.cp[j]);
  const [tab, ps] = copyTable(ci, cj);
  show([i, j], [[i, j, true]].concat(ps.filter(p => !(p[0] === i && p[1] === j)).map(p => [p[0], p[1], false])));
  const c = D.con[`${i},${j}`];
  let h = `<b>bins ${i} – ${j}</b><br>${where(i)}<br>${where(j)}` +
    `<br>3D distance ${fmt(dist3(i, j), 3)} &nbsp; path distance ${(pathd(i, j) / 1e3).toFixed(0)} kb` +
    (FM ? ` &nbsp; contacts ${fmt(val(i, j), 1)}` : '') +
    (c ? ` &nbsp; in <i>${c[0]}</i>${c[1] !== null ? ' (score ' + c[1].toPrecision(3) + ')' : ''}` : '');
  if (ps.length > 1) h += '<br>same pair of regions on all copies:' + tab;
  say(h);
}

function refpair(a, b) {
  a = +a; b = +b;
  const ci = D.ref.flatMap((r, i) => r === a ? [i] : []), cj = D.ref.flatMap((r, i) => r === b ? [i] : []);
  const [tab, ps] = copyTable(ci, cj);
  show([...new Set(ci.concat(cj))], ps.map((p, k) => [p[0], p[1], k === 0]));
  const lab = r => `${D.rk[r][0]}:${(D.rk[r][1] / 1e6).toFixed(3)} Mb`;
  say(`<b>${lab(a)} × ${lab(b)}</b> &nbsp; genome-order contacts ${fmt(rval(a, b), 1)}` +
    `<br>how these contacts sit on the ecDNA (${ci.length} × ${cj.length} copies):` + tab);
}

function near() {
  if (!sel.length) { say('pick a bin, a pair or a gene first'); return; }
  const thr = +$('thr').value * D.step, kb = +$('kb').value, far = $('far').checked;
  const d = D.xyz.map((_, k) => Math.min(...sel.map(s => dist3(s, k))));
  const pd = D.xyz.map((_, k) => Math.min(...sel.map(s => pathd(s, k))));
  const nb = d.flatMap((v, k) => v <= thr && !sel.includes(k) ? [k] : []);
  rows = [];
  for (const t in D.feats) for (const [nm, bins] of D.feats[t]) {
    const k = bins.reduce((a, x) => d[x] < d[a] ? x : a, bins[0]);
    const along = Math.min(...bins.map(x => pd[x])) / 1e3;
    if (d[k] <= thr && !bins.some(x => sel.includes(x)) && (!far || along > kb))
      rows.push([t, nm, k, d[k] / D.step, along]);
  }
  rows.sort((a, b) => a[3] - b[3]);
  const keep = sel.slice();
  show(keep, null, nb);
  let h = `<b>within ${$('thr').value} bin spacings in 3D</b> of ${keep.length} picked bin(s): ${nb.length} bins, ` +
    (rows.length ? `${rows.length} genes/features (table below the plots)` : 'no genes or features');
  const fb = d.map((v, k) => [k, v]).filter(r => pd[r[0]] / 1e3 > kb).sort((x, y) => x[1] - y[1])[0];
  if (fb) h += `<br>closest bin more than ${kb} kb along: bin ${fb[0]}, ${fmt(fb[1] / D.step, 1)} bin spacings in 3D, ${fmt(pd[fb[0]] / 1e3, 0)} kb along`;
  say(h);
  let t = '';
  if (rows.length) {
    t = `<b>genes and features near bin(s) ${keep.join(', ')}</b> (within ${$('thr').value} bin spacings in 3D)` +
      '<table><tr><th>type</th><th>name</th><th>closest bin</th><th>3D (bin spacings)</th><th>along ecDNA (kb)</th></tr>';
    for (const r of rows) t += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${fmt(r[3], 2)}</td>` +
      `<td>${fmt(r[4], 0)}${r[4] > kb ? ' <b>(far along, close in 3D)</b>' : ''}</td></tr>`;
    t += '</table>';
  }
  $('tab').innerHTML = t;
}

function saveCsv() {
  if (!rows.length) { say('run neighbors first'); return; }
  const txt = 'type,name,bin,dist3d_bins,path_kb\n' + rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv'}));
  a.download = '{{TITLE}}_neighbors.csv';
  a.click();
}

function setColor(k) {
  $('col').value = k;
  const idx = F3.data[0].customdata;
  if (k === 'segment') {
    const c = F3.data[0].line.color;
    Plotly.restyle(g3, {'line.color': [c], 'marker.color': [c], 'marker.showscale': false}, [0]);
    return;
  }
  const v = idx.map(i => i === null ? null : D.colors[k][i]);
  // color range: 2nd to 98th percentile
  const ok = v.filter(x => x !== null).sort((a, b) => a - b), q = f => ok[Math.round(f * (ok.length - 1))];
  const lo = q(0.02), hi = q(0.98) > lo ? q(0.98) : ok[ok.length - 1];
  const cs = [[0, '#dddddd'], [0.5, '#f4a582'], [1, '#b2182b']];
  const unit = k.startsWith('fit') ? ' (Spearman)' : k.startsWith('shift') || k === 'spread' ? ' (bin spacings)' : '';
  Plotly.restyle(g3, {'line.color': [v], 'marker.color': [v], 'line.colorscale': [cs], 'marker.colorscale': [cs],
    'line.cmin': lo, 'line.cmax': hi, 'marker.cmin': lo, 'marker.cmax': hi,
    'marker.showscale': true, 'marker.colorbar': {title: {text: k + unit}, len: 0.5, thickness: 12, x: 1, xanchor: 'right'}}, [0]);
}

function setMap(k) {
  $('map').value = k;
  mapNow = k;
  gm.classList.toggle('hide', k !== 'gm');
  gr.classList.toggle('hide', k !== 'gr');
  if (k === 'gr' && !grOn) {
    grOn = true;
    Plotly.newPlot(gr, FR.data, Object.assign({}, FR.layout, {shapes: shpR}), cfg);
    gr.on('plotly_click', e => { const p = e.points[0]; refpair(p.y, p.x); });
  } else Plotly.Plots.resize($(k));
}

function clearPick() {
  sel = []; rows = [];
  show([], null);
  sel = [];
  say(''); $('tab').innerHTML = '';
}

function go() {
  const q = $('q').value.trim();
  if (q === '') return;
  if (/^\d+$/.test(q) && +q < n) return pick(+q);
  const k = Object.keys(D.genes).find(g => g.toLowerCase() === q.toLowerCase());
  if (!k) { say(`${q} not found on this ecDNA`); return; }
  show(D.genes[k], null);
  const r = runs(D.genes[k]).map(x => x[0] === x[1] ? `${x[0]}` : `${x[0]}–${x[1]}`);
  say(`<b>${k}</b>: bins ${r.join(', ')}` + (r.length > 1 ? ` (${r.length} places on the ecDNA)` : ''));
}
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

fitGrid();  // again, now that the toolbar holds every switch
dispatchEvent(new Event('resize'));  // plotly redraws to the new sizes
gp.on('plotly_click', e => {
  const cd = e.points[0].customdata;
  if (Array.isArray(cd)) pair(cd[0], cd[1]); else if (cd !== undefined && cd !== null) pick(cd);
});
if (FM) {
  gm.on('plotly_click', e => { const p = e.points[0]; p.x === p.y ? pick(p.x) : pair(p.y, p.x); });
}
</script>
</body>
</html>
